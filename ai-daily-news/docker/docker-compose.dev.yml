# Docker Compose - 开发环境
version: '3.8'

services:
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - NODE_ENV=development
      
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/news_dev
    depends_on:
      - db-dev
      
  db-dev:
    image: postgres:15
    environment:
      - POSTGRES_DB=news_dev
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"